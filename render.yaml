# Render Blueprint for ThumbPack (optional — manual deploy also works)
# If this file sits at the repo root, Render's "New → Blueprint" can read it.
services:
  - type: web
    name: thumbpack
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set in Render dashboard → Environment (never commit the key)
      - key: AGNES_API_KEY
        sync: false   # Agnes AI image API (image chain provider #1)
      - key: CF_ACCOUNT_ID
        sync: false   # Cloudflare Workers AI (image chain provider #2)
      - key: CF_API_TOKEN
        sync: false   # Cloudflare API token with Workers AI permission
      - key: PORT
        value: 7860
    healthCheckPath: /
