# Render Blueprint for ThumbPack (optional — manual deploy also works)
# If this file sits at the repo root, Render's "New → Blueprint" can read it.
services:
  - type: web
    name: thumbpack
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set in Render dashboard → Environment (never commit the key)
      - key: LEMONSQUEEZY_SIGNING_SECRET
        sync: false   # Lemon Squeezy webhook signing secret
      - key: GUMROAD_PING_SECRET
        sync: false   # our own secret inside the Gumroad Ping URL (?secret=)
      - key: CREEM_WEBHOOK_SECRET
        sync: false   # Creem webhook signing secret
      - key: AGNES_API_KEY
        sync: false   # Agnes AI image API (image chain provider #1)
      - key: CF_ACCOUNT_ID
        sync: false   # Cloudflare Workers AI (image chain provider #2)
      - key: CF_API_TOKEN
        sync: false   # Cloudflare API token with Workers AI permission
      - key: PORT
        value: 7860
    healthCheckPath: /
